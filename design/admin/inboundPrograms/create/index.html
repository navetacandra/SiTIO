        <main id="/admin/dashboard">
            <div class="container">
                <div class="card">
                    <div class="title-container">
                        <h3 class="title">Create Inbound Program</h3>
                    </div>
                    <div class="form-input">
                        <label for="name"
                            >Name<small class="required-mark">*</small></label
                        >
                        <div class="input-group">
                            <input
                                type="text"
                                placeholder="Name of the program"
                                id="name"
                                name="name"
                                style
                                required
                            />
                        </div>
                    </div>
                    <div class="form-input">
                        <label for="study_program"
                            >Study Program<small class="required-mark"
                                >*</small
                            ></label
                        >
                        <div class="input-group">
                            <textarea
                                placeholder="Select a study program"
                                id="study_program"
                                name="study_program"
                                required
                            ></textarea>
                        </div>
                    </div>
                </div>
                <div class="input-box3">
                    <button
                        type="button"
                        class="btn-submit"
                        onclick="document.location = '/admin/inboundPrograms'"
                    >
                        Create Inbound Program</button
                    ><a href="/admin/inboundPrograms" class="back">Cancel</a>
                </div>
            </div>
